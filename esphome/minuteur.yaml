# Kitchen countdown timer on a Waveshare ESP32-S3-Knob-Touch-LCD-1.8
# (Guition JC3636K518C), with three independent timers (slots). A swipe picks
# the slot, the knob sets its duration, a tap starts / pauses / resumes, a long
# press cancels; a slot that finishes takes over the screen. The device owns the countdown, so it keeps
# working without Wi-Fi; Home Assistant only mirrors it to the phone (see
# minuteur-automation.yaml). Build and flash with ./run, see AGENTS.md.
substitutions:
  screen_timeout: 30s
  # Ignore the touch or turn that wakes a dark screen, so waking it never
  # starts or stops anything.
  wake_guard_ms: "600"
  # Horizontal travel (raw panel pixels) that makes a touch a swipe.
  swipe_px: "60"
  # Deep sleep after this long idle with nothing running; the knob or a touch
  # wakes it (a reboot, ~3 s to the screen, longer to Home Assistant).
  sleep_after: 60s
  # An unacknowledged alarm gives up and goes back to idle (then to sleep).
  finished_timeout_ms: "600000"
esphome:
  name: minuteur
  friendly_name: Minuteur
  includes:
    - <driver/rtc_io.h>
    - <esp_sleep.h>
    - minuteur/knob.h
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:
    # Before the display, touch and knob are set up: undo what go_to_sleep
    # left behind (pad holds, wake pins switched to RTC IO).
    - priority: 1000
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            for (gpio_num_t pin : {GPIO_NUM_10, GPIO_NUM_47}) gpio_hold_dis(pin);
            for (gpio_num_t pin : {GPIO_NUM_7, GPIO_NUM_8, GPIO_NUM_9}) rtc_gpio_deinit(pin);
            ESP_LOGI("sleep", "Wake cause: %d", (int) esp_sleep_get_wakeup_cause());
    - priority: -100
      then:
        # Once setup is over: the touchscreen attaches its interrupt late in
        # setup, and must be the one to install the GPIO ISR service.
        - delay: 1s
        - lambda: "knob::setup();"
        - script.execute: haptic_init
        - script.execute: wake
        - script.execute: paint
        - script.execute: publish_all
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
psram:
  mode: octal
  speed: 80MHz
logger:
api:
  encryption:
    key: !secret minuteur_api_key
  actions:
    # Phone notification button "Arrêter": cancels a running timer or
    # silences a finished one.
    - action: stop
      variables:
        slot: int
      then:
        - script.execute:
            id: stop
            slot: !lambda "return slot - 1;"
ota:
  - platform: esphome
    password: !secret minuteur_ota_password
    # Never fall asleep mid-upload.
    on_begin:
      - script.stop: idle_sleep
    on_error:
      - script.execute: idle_sleep
# Wakes on any of the knob's two channels or the touch interrupt going low.
# GPIO9 is shared with the touchscreen; the knob pins are read by
# minuteur/knob.h outside ESPHome's pin registry. go_to_sleep narrows this
# mask to the pins that are high at that moment.
deep_sleep:
  id: sleeper
  esp32_ext1_wakeup:
    pins:
      - GPIO7
      - GPIO8
      - number: GPIO9
        allow_other_uses: true
    mode: ANY_LOW
# No SSID here on purpose: on first boot the device opens the "Minuteur"
# access point and the Wi-Fi network is chosen from its captive portal.
wifi:
  ap:
    ssid: Minuteur
    password: !secret minuteur_ap_password
  on_connect:
    - lambda: |-
        ESP_LOGI("wifi", "Connected on channel %d",
                 (int) wifi::global_wifi_component->get_wifi_channel());
captive_portal:
time:
  - platform: homeassistant
    id: ha_time
    # A wake is a reboot: a timer started with the knob before HA answered
    # went out as "running" with no end time (no clock yet) and a stale
    # remaining, which the dashboard and the phone read as a dead timer.
    # Publish again once the clock is set.
    on_time_sync:
      - script.execute: publish_all
# --- Hardware (pinout from tomereli/coffee-knob and KrX3D/WaveShare-Knob-Esp32S3)
spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]
display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    data_rate: 80MHz
    color_order: rgb
    cs_pin: 14
    reset_pin: 21
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      height: 360
      width: 360
# Touch (CST816 at 0x15) and the DRV2605 haptic driver (0x5A) share this bus.
i2c:
  id: ic_bus
  sda: 11
  scl: 12
touchscreen:
  - platform: cst816
    id: touch
    display: main_display
    interrupt_pin:
      number: GPIO9
      allow_other_uses: true
    reset_pin: GPIO10
    on_touch:
      - lambda: "id(touch_dx) = 0;"
      - script.execute: wake
    # Horizontal travel of the finger since it landed, for swipes (see tap).
    on_update:
      - lambda: |-
          for (auto &t : touches) {
            id(touch_dx) = (int) t.x - (int) t.x_org;
            break;
          }
output:
  - platform: ledc
    pin: GPIO47
    id: backlight_pwm
light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    internal: true
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    on_turn_off:
      - lvgl.pause:
    on_turn_on:
      - lvgl.resume:
sensor:
  # Battery behind a 2:1 divider on GPIO1 (ADC1_CH0).
  - platform: adc
    id: battery_voltage
    pin: GPIO1
    name: Tension batterie
    entity_category: diagnostic
    attenuation: 12db
    update_interval: 10s
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      # Publish soon after a wake: awake windows are short.
      - median:
          window_size: 5
          send_every: 6
          send_first_at: 2
    on_value:
      - component.update: battery_level
  - platform: template
    id: battery_level
    name: Batterie
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: "return id(battery_voltage).state;"
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.00 -> 0.0
            - 3.50 -> 10.0
            - 3.65 -> 30.0
            - 3.75 -> 50.0
            - 3.90 -> 70.0
            - 4.10 -> 90.0
            - 4.20 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: wifi_signal
    name: Signal Wi-Fi
    entity_category: diagnostic
    update_interval: 60s
  - platform: template
    name: Canal Wi-Fi
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: "return wifi::global_wifi_component->get_wifi_channel();"
  # Per slot. Slot 1 keeps the original names (sensor.minuteur_etat, ...)
  # so its entity ids, and what reads them, stay as they were.
  # Seconds left, published on every state change (not every second).
  - platform: template
    id: remaining_0
    name: Restant
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: total_0
    name: Durée
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: remaining_1
    name: Restant 2
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: total_1
    name: Durée 2
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: remaining_2
    name: Restant 3
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: total_2
    name: Durée 3
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
text_sensor:
  # idle | running | paused | finished
  - platform: template
    id: state_0
    name: État
    update_interval: never
  - platform: template
    id: state_1
    name: État 2
    update_interval: never
  - platform: template
    id: state_2
    name: État 3
    update_interval: never
  # UTC ISO 8601 end time while running, empty otherwise. Plain text rather
  # than a timestamp entity, so the empty value is not an invalid datetime.
  - platform: template
    id: end_0
    name: Fin
    update_interval: never
  - platform: template
    id: end_1
    name: Fin 2
    update_interval: never
  - platform: template
    id: end_2
    name: Fin 3
    update_interval: never
switch:
  # Off keeps the device awake (for OTA from the desk, or debugging).
  - platform: template
    id: auto_sleep
    name: Veille automatique
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: idle_sleep
button:
  - platform: template
    name: Arrêter
    on_press:
      - script.execute:
          id: stop
          slot: 0
  - platform: template
    name: Arrêter 2
    on_press:
      - script.execute:
          id: stop
          slot: 1
  - platform: template
    name: Arrêter 3
    on_press:
      - script.execute:
          id: stop
          slot: 2
# --- State
globals:
  # One entry per slot. Duration chosen with the knob, kept across reboots.
  - id: set_s
    type: std::array<int, 3>
    restore_value: true
    initial_value: "{300, 600, 900}"
  # 0 idle, 1 running, 2 paused, 3 finished
  - id: state
    type: std::array<int, 3>
    initial_value: "{0, 0, 0}"
  - id: total_s
    type: std::array<int, 3>
    initial_value: "{0, 0, 0}"
  - id: end_ms
    type: std::array<uint32_t, 3>
    initial_value: "{0, 0, 0}"
  - id: left_ms
    type: std::array<uint32_t, 3>
    initial_value: "{0, 0, 0}"
  # When each slot finished (for finished_timeout).
  - id: done_ms
    type: std::array<uint32_t, 3>
    initial_value: "{0, 0, 0}"
  # Horizontal travel of the current/last touch, in raw panel pixels.
  - id: touch_dx
    type: int
    initial_value: "0"
  # The slot on screen.
  - id: sel
    type: int
    initial_value: "0"
  - id: shown_s
    type: int
    initial_value: "-1"
  - id: screen_on
    type: bool
    initial_value: "true"
  - id: wake_ms
    type: uint32_t
    initial_value: "0"
  # Seconds HA has been connected without a break (see idle_sleep).
  - id: api_up_s
    type: int
    initial_value: "0"
  # Knob inertia (see turn): when the last detent came, its direction, and a
  # smoothed interval between detents in ms.
  - id: turn_last_ms
    type: uint32_t
    initial_value: "0"
  - id: turn_last_dir
    type: int
    initial_value: "0"
  - id: turn_avg_ms
    type: float
    initial_value: "400"
interval:
  # The knob is read by interrupts (minuteur/knob.h); this drains the count.
  # A batch of several detents is one fast movement.
  - interval: 20ms
    then:
      - lambda: |-
          int n = knob::take();
          if (n != 0) id(turn)->execute(n > 0 ? 1 : -1, n > 0 ? n : -n);
  - interval: 1s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: "id(api_up_s)++;"
            - lvgl.widget.update:
                id: link_dot
                hidden: true
          else:
            - lambda: "id(api_up_s) = 0;"
            # Not connected to HA (yet): the amber dot under the hint.
            - lvgl.widget.update:
                id: link_dot
                hidden: false
  - interval: 200ms
    then:
      - lambda: |-
          int finished = -1;
          for (int i = 0; i < 3; i++) {
            if (id(state)[i] == 1) {
              int32_t left = (int32_t) (id(end_ms)[i] - millis());
              if (left <= 0) {
                id(state)[i] = 3;
                id(left_ms)[i] = 0;
                id(done_ms)[i] = millis();
                finished = i;
              } else {
                id(left_ms)[i] = left;
              }
            } else if (id(state)[i] == 3 &&
                       millis() - id(done_ms)[i] > ${finished_timeout_ms}) {
              // Unacknowledged: give up so the device can sleep again.
              id(stop)->execute(i);
            }
          }
          if (finished >= 0) {
            id(sel) = finished;  // the finished slot takes over the screen
            id(publish)->execute(finished);
            id(ring)->execute();
          }
          if (id(state)[id(sel)] == 1 || finished >= 0) id(paint)->execute();
# --- Behaviour
script:
  - id: haptic_init
    then:
      # The DRV2605 acks writes but NAKs reads, so the RAR/esphome-drv2605
      # component fails setup. Write the three setup registers directly:
      # out of standby, LRA mode, LRA effect library.
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t mode[2] = {0x01, 0x00};
          uint8_t feedback[2] = {0x1A, 0x80};
          uint8_t library[2] = {0x03, 0x06};
          id(ic_bus)->write(addr, mode, 2);
          id(ic_bus)->write(addr, feedback, 2);
          id(ic_bus)->write(addr, library, 2);
  # DRV2605 library effects: 1 strong click, 7 soft bump, 10 double click,
  # 16 one-second alert.
  - id: haptic
    parameters:
      effect: int
    mode: parallel
    max_runs: 4
    then:
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t wave[2] = {0x04, (uint8_t) effect};
          uint8_t end[2] = {0x05, 0x00};
          uint8_t go[2] = {0x0C, 0x01};
          id(ic_bus)->write(addr, wave, 2);
          id(ic_bus)->write(addr, end, 2);
          id(ic_bus)->write(addr, go, 2);
  # Lights the screen and restarts the dim timer. Records when a dark screen
  # was woken so that input is swallowed by the wake guard.
  - id: wake
    then:
      - lambda: |-
          if (!id(screen_on)) id(wake_ms) = millis();
          id(screen_on) = true;
      - light.turn_on:
          id: backlight
          brightness: 80%
      - script.execute: screen_timer
      - script.execute: idle_sleep
  # Restarted by every interaction (through wake). Only an idle timer sleeps:
  # running, paused and finished all keep the device up. Waits until HA has
  # been connected for 20 s: Wi-Fi can take a minute (the box's BSS fails
  # before the repeater answers), and sleeping the moment HA connects left HA
  # with "unknown" states (the on_client_connected trigger raced the sleep).
  # Without Wi-Fi at all, it sleeps anyway after 3 min of uptime.
  - id: idle_sleep
    mode: restart
    then:
      - delay: $sleep_after
      - if:
          condition:
            lambda: |-
              for (int st : id(state)) if (st != 0) return false;
              return id(auto_sleep).state;
          then:
            - if:
                condition:
                  lambda: "return id(api_up_s) >= 20 || millis() > 180000;"
                then:
                  - script.execute: go_to_sleep
                else:
                  - script.execute: idle_sleep
  - id: go_to_sleep
    then:
      - if:
          condition:
            # ext1 wakes on a level: a pin already low would wake it at once.
            # A finger on the screen (GPIO9 low) keeps it awake. A knob
            # channel held low (resting half-way through a detent) is left
            # out of the wake mask instead: the other channel and touch
            # still wake it.
            lambda: |-
              if (gpio_get_level(GPIO_NUM_9) == 0) {
                ESP_LOGW("sleep", "Touch interrupt low, staying awake");
                return false;
              }
              uint64_t mask = 1ULL << GPIO_NUM_9;
              for (gpio_num_t pin : {GPIO_NUM_7, GPIO_NUM_8}) {
                if (gpio_get_level(pin) == 0) {
                  ESP_LOGW("sleep", "GPIO%d held low, not a wake source", (int) pin);
                } else {
                  mask |= 1ULL << pin;
                }
              }
              id(sleeper)->set_ext1_wakeup({mask, ESP_EXT1_WAKEUP_ANY_LOW});
              return true;
          then:
            - logger.log: "Idle, going to deep sleep"
            - lambda: |-
                // Haptic driver into standby.
                uint8_t standby[2] = {0x01, 0x40};
                id(ic_bus)->write(0x5A, standby, 2);
                // Backlight held off, touch controller held out of reset
                // (it must stay alive to wake us).
                gpio_reset_pin(GPIO_NUM_47);
                gpio_set_direction(GPIO_NUM_47, GPIO_MODE_OUTPUT);
                gpio_set_level(GPIO_NUM_47, 0);
                gpio_set_level(GPIO_NUM_10, 1);
                gpio_hold_en(GPIO_NUM_47);
                gpio_hold_en(GPIO_NUM_10);
                gpio_deep_sleep_hold_en();
                // Keep the wake pins pulled up while asleep.
                esp_sleep_pd_config(ESP_PD_DOMAIN_RTC_PERIPH, ESP_PD_OPTION_ON);
                for (gpio_num_t pin : {GPIO_NUM_7, GPIO_NUM_8, GPIO_NUM_9}) {
                  rtc_gpio_pullup_en(pin);
                  rtc_gpio_pulldown_dis(pin);
                }
            - deep_sleep.enter: sleeper
          else:
            - script.execute: idle_sleep
  - id: screen_timer
    mode: restart
    then:
      - delay: $screen_timeout
      - if:
          condition:
            lambda: |-
              for (int st : id(state)) if (st == 3) return true;
              return false;
          then:
            # A finished timer keeps the screen lit until acknowledged.
            - script.execute: screen_timer
          else:
            - if:
                condition:
                  lambda: |-
                    for (int st : id(state)) if (st == 1) return true;
                    return false;
                then:
                  # Something running: stay readable, dimmed.
                  - light.turn_on:
                      id: backlight
                      brightness: 15%
                else:
                  - lambda: "id(screen_on) = false;"
                  - light.turn_off: backlight
  # Swipes move between the three slots, wrapping around.
  - id: select_slot
    parameters:
      delta: int
    then:
      - if:
          condition:
            lambda: "return !id(screen_on) || millis() - id(wake_ms) < ${wake_guard_ms};"
          then:
            - script.execute: wake
          else:
            - script.execute: wake
            - lambda: "id(sel) = (id(sel) + delta + 3) % 3;"
            - script.execute:
                id: haptic
                effect: 7
            - script.execute: paint
  - id: turn
    parameters:
      dir: int
      count: int
    then:
      - if:
          condition:
            lambda: "return !id(screen_on) || millis() - id(wake_ms) < ${wake_guard_ms};"
          then:
            - script.execute: wake
          else:
            - script.execute: wake
            - if:
                condition:
                  lambda: "return id(state)[id(sel)] == 3;"
                then:
                  - script.execute:
                      id: stop
                      slot: !lambda "return id(sel);"
                else:
                  - if:
                      condition:
                        lambda: "return id(state)[id(sel)] == 0;"
                      then:
                        # Finer steps for short durations: 10 s below 1 min, 30 s
                        # below 10 min, 1 min below 1 h, then 5 min up to 3 h.
                        #
                        # Inertia: a fast spin multiplies that step (up to x10)
                        # so long durations take a flick, not many turns. The
                        # speed is a smoothed interval per detent (count detents
                        # since the last batch). Measured: ~25 ms per detent on a
                        # fast spin, 600+ ms on a slow one. A pause (400 ms) or a
                        # change of direction drops back to x1, so a small, slow
                        # movement stays precise; each detent snaps onto the
                        # step grid, so values stay round.
                        - lambda: |-
                            uint32_t now = millis();
                            uint32_t dt = (now - id(turn_last_ms)) / count;
                            id(turn_last_ms) = now;
                            if (dt > 400 || dir != id(turn_last_dir)) {
                              id(turn_avg_ms) = 400;
                            } else {
                              id(turn_avg_ms) = 0.6f * id(turn_avg_ms) + 0.4f * dt;
                            }
                            id(turn_last_dir) = dir;
                            float a = id(turn_avg_ms);
                            int mult = a < 30 ? 10 : a < 50 ? 6 : a < 80 ? 3 : a < 130 ? 2 : 1;

                            int s = id(set_s)[id(sel)];
                            for (int i = 0; i < count; i++) {
                              int ref = dir > 0 ? s : s - 1;
                              int step = ref < 60 ? 10 : ref < 600 ? 30 : ref < 3600 ? 60 : 300;
                              s += dir * step * mult;
                              if (s < 10) s = 10;
                              if (s > 10800) s = 10800;
                              int grid = s < 60 ? 10 : s < 600 ? 30 : s < 3600 ? 60 : 300;
                              s = dir > 0 ? s / grid * grid : (s + grid - 1) / grid * grid;
                              if (s < 10) s = 10;
                            }
                            id(set_s)[id(sel)] = s;
                        - script.execute:
                            id: haptic
                            effect: 7
                        - script.execute: paint
  # LVGL's own swipe detection never fired on this panel (the CST816 reports
  # too few points mid-swipe), and the release still arrived as a click that
  # paused the timer. So a touch that travelled more than swipe_px
  # horizontally is a swipe here, never a tap. The panel is turned 180° by
  # LVGL, so raw travel to the right is a swipe to the left on screen.
  - id: tap
    then:
      - if:
          condition:
            lambda: "return abs(id(touch_dx)) > ${swipe_px};"
          then:
            # touch_dx stays as is until the next touch: the check below
            # reads it again, and a reset here made every swipe also tap.
            - script.execute:
                id: select_slot
                delta: !lambda "return id(touch_dx) > 0 ? 1 : -1;"
      - if:
          condition:
            lambda: "return abs(id(touch_dx)) <= ${swipe_px} && millis() - id(wake_ms) >= ${wake_guard_ms};"
          then:
            - if:
                condition:
                  lambda: "return id(state)[id(sel)] == 3;"
                then:
                  - script.execute:
                      id: stop
                      slot: !lambda "return id(sel);"
                else:
                  - lambda: |-
                      int i = id(sel);
                      switch (id(state)[i]) {
                        case 0:  // start
                          id(total_s)[i] = id(set_s)[i];
                          id(left_ms)[i] = (uint32_t) id(set_s)[i] * 1000;
                          id(end_ms)[i] = millis() + id(left_ms)[i];
                          id(state)[i] = 1;
                          break;
                        case 1:  // pause
                          id(left_ms)[i] = id(end_ms)[i] - millis();
                          id(state)[i] = 2;
                          break;
                        case 2:  // resume
                          id(end_ms)[i] = millis() + id(left_ms)[i];
                          id(state)[i] = 1;
                          break;
                      }
                  - script.execute:
                      id: haptic
                      effect: 1
                  - script.execute: paint
                  - script.execute:
                      id: publish
                      slot: !lambda "return id(sel);"
  - id: long_press
    then:
      - if:
          condition:
            # A slow swipe outlasts the long-press time: not a cancel.
            lambda: "return abs(id(touch_dx)) <= ${swipe_px} && (id(state)[id(sel)] == 1 || id(state)[id(sel)] == 2);"
          then:
            - script.execute:
                id: stop
                slot: !lambda "return id(sel);"
  # Back to idle: cancels a slot's countdown or silences its alarm.
  - id: stop
    mode: queued
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot > 2) return;
          id(state)[slot] = 0;
          id(left_ms)[slot] = 0;
      - script.execute:
          id: haptic
          effect: 10
      - script.execute: wake
      - script.execute: paint
      - script.execute:
          id: publish
          slot: !lambda "return slot;"
  # Vibrates while any slot is finished, for up to two minutes. The
  # "finished" state outlives it, so the phone alarm keeps ringing until
  # someone acknowledges either end, or until finished_timeout gives up.
  # A new finish restarts it.
  - id: ring
    mode: restart
    then:
      - script.execute: wake
      - repeat:
          count: 60
          then:
            - if:
                condition:
                  lambda: |-
                    for (int st : id(state)) if (st == 3) return true;
                    return false;
                then:
                  - script.execute:
                      id: haptic
                      effect: 16
            - delay: 2s
  - id: publish
    mode: queued
    parameters:
      slot: int
    then:
      - lambda: |-
          static const char *const names[] = {"idle", "running", "paused", "finished"};
          text_sensor::TextSensor *st[] = {id(state_0), id(state_1), id(state_2)};
          text_sensor::TextSensor *en[] = {id(end_0), id(end_1), id(end_2)};
          sensor::Sensor *tot[] = {id(total_0), id(total_1), id(total_2)};
          sensor::Sensor *rem[] = {id(remaining_0), id(remaining_1), id(remaining_2)};
          int i = slot;
          st[i]->publish_state(names[id(state)[i]]);
          tot[i]->publish_state(id(state)[i] == 0 ? 0 : id(total_s)[i]);
          rem[i]->publish_state((id(left_ms)[i] + 999) / 1000);
          std::string end = "";
          auto now = id(ha_time).now();
          if (id(state)[i] == 1 && now.is_valid()) {
            ESPTime t = ESPTime::from_epoch_utc(now.timestamp + (id(left_ms)[i] + 500) / 1000);
            end = t.strftime("%Y-%m-%dT%H:%M:%SZ");
          }
          en[i]->publish_state(end);
  - id: publish_all
    then:
      - lambda: "for (int i = 0; i < 3; i++) id(publish)->execute(i);"
  - id: paint
    then:
      - lambda: |-
          int i = id(sel);
          int s = id(state)[i] == 0 ? id(set_s)[i] : (int) ((id(left_ms)[i] + 999) / 1000);
          id(shown_s) = s;
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            static char b[16];
            int s = id(shown_s);
            if (s >= 3600) snprintf(b, sizeof(b), "%d:%02d:%02d", s / 3600, s / 60 % 60, s % 60);
            else snprintf(b, sizeof(b), "%02d:%02d", s / 60, s % 60);
            return b;
      - lvgl.label.update:
          id: lbl_state
          text: !lambda |-
            static const char *const t[] = {"", " · en cours", " · en pause", " · terminé !"};
            static char b[40];
            snprintf(b, sizeof(b), "Minuteur %d%s", id(sel) + 1, t[id(state)[id(sel)]]);
            return b;
      - lvgl.label.update:
          id: lbl_hint
          text: !lambda |-
            static const char *const t[] = {
              "Toucher pour lancer\nGlisser : autre minuteur",
              "Toucher : pause\nAppui long : annuler",
              "Toucher : reprendre\nAppui long : annuler",
              "Toucher pour arrêter",
            };
            return t[id(state)[id(sel)]];
      - lvgl.arc.update:
          id: ring_arc
          value: !lambda |-
            int i = id(sel);
            int v;
            if (id(state)[i] == 0) v = id(set_s)[i] >= 3600 ? 1000 : id(set_s)[i] * 1000 / 3600;
            else if (id(state)[i] == 3) v = 1000;
            else v = id(total_s)[i] > 0 ? (int) (id(left_ms)[i] / id(total_s)[i]) : 0;
            return v;
          indicator:
            arc_color: !lambda |-
              static const uint32_t c[] = {0x4FA3FF, 0xF5A623, 0x8A8A8A, 0xE53935};
              return lv_color_hex(c[id(state)[id(sel)]]);
      # One dot per slot: colour = its state, ring = the slot on screen.
      - lvgl.widget.update:
          id: dot_0
          bg_color: !lambda |-
            static const uint32_t c[] = {0x3A3A3A, 0xF5A623, 0x8A8A8A, 0xE53935};
            return lv_color_hex(c[id(state)[0]]);
          border_width: !lambda "return id(sel) == 0 ? 2 : 0;"
      - lvgl.widget.update:
          id: dot_1
          bg_color: !lambda |-
            static const uint32_t c[] = {0x3A3A3A, 0xF5A623, 0x8A8A8A, 0xE53935};
            return lv_color_hex(c[id(state)[1]]);
          border_width: !lambda "return id(sel) == 1 ? 2 : 0;"
      - lvgl.widget.update:
          id: dot_2
          bg_color: !lambda |-
            static const uint32_t c[] = {0x3A3A3A, 0xF5A623, 0x8A8A8A, 0xE53935};
            return lv_color_hex(c[id(state)[2]]);
          border_width: !lambda "return id(sel) == 2 ? 2 : 0;"
# --- Screen
font:
  - file: "gfonts://Roboto Mono@500"
    id: font_time
    size: 68
    glyphs: "0123456789:"
  - file: "gfonts://Roboto@400"
    id: font_text
    size: 22
    glyphs: " !:'-.,·0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzàâçéèêëîïôùûü"
lvgl:
  displays: [main_display]
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 800ms
  buffer_size: 25%
  color_depth: 16
  # Upside down, to suit how the device sits. Rotation belongs here, not on
  # display: LVGL rejects a rotated display and rotates touch input itself.
  # The board has no IMU, so this cannot follow the device.
  rotation: 180
  bg_color: 0x000000
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        - arc:
            id: ring_arc
            align: CENTER
            width: 344
            height: 344
            rotation: 270
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 1000
            value: 0
            adjustable: false
            clickable: false
            arc_width: 14
            arc_color: 0x202020
            indicator:
              arc_width: 14
              arc_color: 0x4FA3FF
            knob:
              bg_opa: TRANSP
        - label:
            id: lbl_state
            align: CENTER
            y: -78
            text: "Minuteur 1"
            text_font: font_text
            text_color: 0x9A9A9A
        - label:
            id: lbl_time
            align: CENTER
            y: -6
            text: "05:00"
            text_font: font_time
            text_color: 0xFFFFFF
        - label:
            id: lbl_hint
            align: CENTER
            y: 74
            text: "Toucher pour lancer"
            text_font: font_text
            text_align: CENTER
            text_color: 0x9A9A9A
        # Shown while HA is not connected (see the 1 s interval).
        - obj:
            id: link_dot
            align: CENTER
            y: -118
            width: 12
            height: 12
            radius: 6
            bg_color: 0xE5A100
            border_width: 0
            clickable: false
            hidden: false
        # Slot dots (see paint).
        - obj:
            id: dot_0
            align: CENTER
            x: -28
            y: 124
            width: 14
            height: 14
            radius: 7
            bg_color: 0x3A3A3A
            border_color: 0xFFFFFF
            border_width: 2
            clickable: false
        - obj:
            id: dot_1
            align: CENTER
            x: 0
            y: 124
            width: 14
            height: 14
            radius: 7
            bg_color: 0x3A3A3A
            border_color: 0xFFFFFF
            border_width: 0
            clickable: false
        - obj:
            id: dot_2
            align: CENTER
            x: 28
            y: 124
            width: 14
            height: 14
            radius: 7
            bg_color: 0x3A3A3A
            border_color: 0xFFFFFF
            border_width: 0
            clickable: false
        # Transparent full-screen hit area, declared last so it sits on top
        # and receives every tap and swipe.
        - obj:
            align: CENTER
            width: 360
            height: 360
            bg_opa: TRANSP
            border_width: 0
            on_short_click:
              - script.execute: tap
            on_long_press:
              - script.execute: long_press
