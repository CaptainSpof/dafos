# Mouse wheel keys on the navigation layer (&msc).
CONFIG_ZMK_POINTING=y

# Backlight is driven by the gaming layer switch: solid white, 16 %, off at boot.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=16
